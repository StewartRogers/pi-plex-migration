name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check scripts
        run: |
          for f in scripts/*.sh scripts/lib/*.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh scripts/lib/*.sh
